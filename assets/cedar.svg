<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="title">
  <title id="title">Cedar tree</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F9F4"/>
      <stop offset="1" stop-color="#D5EBDB"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FAF74"/>
      <stop offset="1" stop-color="#1E6B43"/>
    </linearGradient>
    <linearGradient id="leafDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F8A57"/>
      <stop offset="1" stop-color="#154D30"/>
    </linearGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A5A3B"/>
      <stop offset="1" stop-color="#5E3A24"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="200" cy="200" r="190"/></clipPath>
  </defs>

  <circle cx="200" cy="200" r="190" fill="url(#sky)"/>
  <g clip-path="url(#disc)">
    <circle cx="300" cy="105" r="26" fill="#FFE7A8" opacity="0.9"/>
    <ellipse cx="200" cy="395" rx="260" ry="70" fill="#9FD1AE"/>
    <ellipse cx="200" cy="410" rx="230" ry="60" fill="#7FBF93"/>
  </g>

